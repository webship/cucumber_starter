################
# GitLab CI for the Cucumber Starter site template (a drupal-recipe project).
#
# The drupal.org GitLab templates build a Drupal site with this recipe in
# recipes/cucumber_starter, then run composer-lint and cspell. The `recipe` job
# below installs Drupal from the recipe to prove that it applies, and the
# `webship-js-test` job runs the webship-js suite on a site installed from it.
# Documentation: https://project.pages.drupalcode.org/gitlab_templates/
################
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _TARGET_PHP: '8.4'
  DRUPAL_CORE: &drupal_core '11.4.x-dev'
  # Display Builder, UI Suite and Media Directories have no stable release yet.
  MINIMUM_STABILITY_OVERRIDE: &minimum_stability 'dev'
  # No PHP, CSS or PHPUnit tests here. The only JavaScript is the webship-js
  # test tooling, and the recipe YAML is checked by applying the recipe.
  SKIP_ESLINT: '1'
  SKIP_PHPCS: '1'
  SKIP_PHPSTAN: '1'
  SKIP_PHPUNIT: '1'
  SKIP_STYLELINT: '1'
  # Node modules are only needed by cspell, which installs them itself.
  _COMPOSER_YARN_INSTALL: '0'
  # composer-lint and cspell must pass.
  _ALL_VALIDATE_ALLOW_FAILURE: '0'

composer:
  variables:
    # The composer job sets its own values: use the global ones.
    DRUPAL_CORE: *drupal_core
    MINIMUM_STABILITY_OVERRIDE: *minimum_stability

# Install Drupal from the recipe, and check the result.
recipe:
  extends: .testing-job-base
  needs: [composer]
  # Only the database: no browser is needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  script:
    - cd $CI_PROJECT_DIR
    - test "$COMPOSER_END_CODE" = "0"
    # Run the Drush PHP script directly: vendor/bin/drush is a shell proxy.
    - export DRUSH="php -d memory_limit=-1 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    - $DRUSH site:install $CI_PROJECT_DIR/recipes/$PROJECT_NAME -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name=admin --account-pass=admin --site-name="$PROJECT_NAME"
    - $DRUSH status --fields=drupal-version,db-status,theme
    # The Cucumber content: features with their Gherkin scripts, and the
    # components, products and projects a test suite is organised by.
    - test "$($DRUSH config:get media.type.feature id --format=string)" = "feature"
    - test "$($DRUSH config:get node.type.component type --format=string)" = "component"
    - test "$($DRUSH config:get node.type.product type --format=string)" = "product"
    - test "$($DRUSH config:get node.type.project type --format=string)" = "project"
    - test "$($DRUSH config:get taxonomy.vocabulary.feature_directory vid --format=string)" = "feature_directory"
    # The automated testing workflow, the dashboards and the test screens.
    - test "$($DRUSH config:get workflows.workflow.automated_testing id --format=string)" = "automated_testing"
    - test "$($DRUSH config:get system.site page.front --format=string)" = "/webdashboard/default_dashboard"
    - test "$($DRUSH config:get webdashboard.webdashboard.default_dashboard id --format=string)" = "default_dashboard"
    - $DRUSH pm:list --status=enabled --format=list | grep -qx cucumber_ui
    # UIkit Admin is the theme, front and back, with its blocks.
    - test "$($DRUSH config:get system.theme default --format=string)" = "uikit_admin"
    - test "$($DRUSH config:get system.theme admin --format=string)" = "uikit_admin"
    - test "$($DRUSH config:get block.block.uikit_admin_content region --format=string)" = "content"
    # Anonymous visitors are sent to the log in page, and the pages of a
    # password reset stay open.
    - $DRUSH pm:list --status=enabled --format=list | grep -qx anonymous_redirect
    - test "$($DRUSH config:get anonymous_redirect.settings enable_redirect --format=string)" = "1"
    - test "$($DRUSH config:get anonymous_redirect.settings redirect_url --format=string)" = "/user/login"
    # The Admin role writes a feature and moves it through the workflow, and
    # holds no permission that administers the site.
    - $DRUSH config:get user.role.admin permissions --format=json > admin-permissions.json
    - grep -q '"use text format gherkin"' admin-permissions.json
    - grep -q '"use automated_testing transition back_to_draft"' admin-permissions.json
    - grep -q '"use automated_testing transition implemented"' admin-permissions.json
    - grep -q '"create product content"' admin-permissions.json
    # The dashboards are Web Dashboard ones: the Admin role views its own, and
    # every signed-in person views the default one, which is the front page.
    - grep -q '"can view admin_dashboard webdashboard"' admin-permissions.json
    - $DRUSH config:get user.role.authenticated permissions --format=json | grep -q '"can view default_dashboard webdashboard"'
    - test "$(grep -c 'administer ' admin-permissions.json)" = "0"
    # The Features page asks for its own permission.
    - test "$($DRUSH config:get views.view.features display.default.display_options.access.options.perm --format=string)" = "access features page"

# The webship-js suite (package.json, cucumber.js, tests/) on a site installed
# from the recipe. The site build creates the accounts of cucumber.js
# (worldParameters.users), with passwords made for this job: the suite only
# logs in, and removes what it creates.
webship-js-test:
  extends: .testing-job-base
  needs: [composer]
  # Only the database: Playwright brings its own Chromium.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USER: "webmaster"
    DRUPAL_ADMIN_MAIL: "webmaster@example.test"
    CUCUMBER_ADMIN_USER: "admin_user"
    CUCUMBER_ADMIN_MAIL: "admin_user@example.test"
    DRUPAL_AUTHENTICATED_USER: "authenticated_user"
    DRUPAL_AUTHENTICATED_MAIL: "authenticated_user@example.test"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    # No yarn.lock is committed: let Yarn 4 write one in the job.
    YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  script:
    - cd $CI_PROJECT_DIR
    - test "$COMPOSER_END_CODE" = "0"
    - export DRUSH="php -d memory_limit=-1 $CI_PROJECT_DIR/vendor/drush/drush/drush.php --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    # Test account passwords, for this job only.
    - export DRUPAL_ADMIN_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export CUCUMBER_ADMIN_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    - export DRUPAL_AUTHENTICATED_PASS=$(php -r "echo bin2hex(random_bytes(12));")
    # The site, from the recipe, with the Webmaster account.
    - $DRUSH site:install $CI_PROJECT_DIR/recipes/$PROJECT_NAME -y
      --db-url=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
      --account-name="$DRUPAL_ADMIN_USER" --account-mail="$DRUPAL_ADMIN_MAIL" --account-pass="$DRUPAL_ADMIN_PASS"
      --site-name="Cucumber Starter Test"
    # The other accounts: a member of the Admin role and one without a role.
    - $DRUSH user:create "$CUCUMBER_ADMIN_USER" --mail="$CUCUMBER_ADMIN_MAIL" --password="$CUCUMBER_ADMIN_PASS"
    - $DRUSH user:role:add admin "$CUCUMBER_ADMIN_USER"
    - $DRUSH user:create "$DRUPAL_AUTHENTICATED_USER" --mail="$DRUPAL_AUTHENTICATED_MAIL" --password="$DRUPAL_AUTHENTICATED_PASS"
    # A test runner has no mail server: collect the mails, so the password
    # request returns at once.
    - $DRUSH config:set system.mail interface.default test_mail_collector -y
    # Apache serves the site at http://localhost.
    - mkdir -p $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chown -R www-data:www-data $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - service apache2 start
    # Node.js 24, the packages of package.json and Chromium. webship-js's
    # install script may write a cucumber.js of its own: keep this one.
    - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
    - apt-get install -y nodejs
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium
    # Every step resolves, then the run.
    - ./node_modules/.bin/cucumber-js --config cucumber.js --dry-run
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days

.composer-base:
  variables:
    # Drupal core's own Yarn 4.9.1 would read the project .yarnrc.yml (Yarn >= 4.14 keys) too.
    YARN_RC_FILENAME: .yarnrc.core.yml
    YARN_NODE_LINKER: node-modules

stylelint:
  variables:
    # Drupal core's own Yarn 4.9.1 would read the project .yarnrc.yml (Yarn >= 4.14 keys) too.
    YARN_RC_FILENAME: .yarnrc.core.yml
    YARN_NODE_LINKER: node-modules

cspell:
  variables:
    # cspell installs Drupal core's node_modules with core's Yarn 4.9.1, which reads the project .yarnrc.yml too.
    YARN_RC_FILENAME: .yarnrc.core.yml
    YARN_NODE_LINKER: node-modules
